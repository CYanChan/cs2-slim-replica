name: Detect Update

# 2026-10-31: 本仓库为 fork, 执行 Actions 需在网页上启用一次。
#   启用后 push 与 schedule 均应生效。

# 每 15 分钟检测一次 CS2 是否更新（数据源：SteamCMD +app_info_print 730，直连 Steam）。
# 检测到变化时：
#   1. 更新 state/buildid.json
#   2. 触发 Rebuild Slim Packages 工作流，从 Steam depot 重建并发布新 Release
#
# 本工作流不依赖任何第三方仓库：CS2 版本信息取自 Steam，构建产物发布在本仓库。
#
# 注意：GitHub 对 schedule 触发有排队延迟，公开仓库高峰期常见 5~20 分钟漂移，
# 因此“每 15 分钟”是检测意图，不保证严格 15 分钟落点。workflow_dispatch 可随时手动跑。

# ============================================================================
# 触发方式(2026-10-31 排障记录, 踩过的坑都在这)
#
# 1) schedule: 本仓库是 cyqmq/cs2-slim-replica 的 fork。
#    GitHub 对 fork 的 schedule 触发器默认禁用，所以 cron 从未运行过
#    (API 里 workflow_runs total 一直是 1，那唯一一条还是手工 workflow_dispatch)。
#    必须在网页 Actions 页点一次 "I understand my workflows, go ahead and enable them"。
#
# 2) push: 即便启用后，改这个文件的触发器定义也【不会】立刻生效 ——
#    GitHub 会缓存老工作流的定义。实测: 同一个 commit 里新加的 ping-test.yml
#    能正常 event=push 跑起来，而本文件加 push: 后连续几次推送都不触发。
#    解决办法是把文件改名(本文件原名 detect-cs2-update.yml → detect-update.yml)，
#    让 GitHub 当成全新工作流重新解析，之后 push 立刻生效。
#    → 以后若再改触发器却不见效，同样手法: 改名或换路径。
#
# 3) workflow_dispatch: 随时可在网页手动跑。
# ============================================================================
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'state/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: cs2-update-detect
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current buildid
        run: |
          set -euo pipefail
          python3 scripts/updater/get-buildid.py | tee current.json
          # 防御：脚本异常但被 tee 吞掉退出码时，这里兜底校验产物
          python3 - <<'PY'
          import json, sys
          try:
              d = json.load(open("current.json"))
          except Exception as e:
              sys.exit(f"current.json 无效: {e}")
          if not str(d.get("buildid", "")).isdigit():
              sys.exit(f"current.json 缺少合法 buildid: {d}")
          print(f"当前 buildid = {d['buildid']}, depots = {d.get('depots')}")
          PY

      - name: Compare with state
        id: compare
        run: |
          set -euo pipefail
          NEW_BID=$(python3 -c "import json;print(json.load(open('current.json'))['buildid'])")
          NEW_DEPOTS=$(python3 -c "import json;print(json.dumps(json.load(open('current.json')).get('depots',{}),sort_keys=True))")

          if [ ! -f state/buildid.json ]; then
            echo "first_run=true" >> "$GITHUB_OUTPUT"
            echo "changed=false"  >> "$GITHUB_OUTPUT"
            echo "状态文件不存在，仅记录当前 buildid，不触发重建"
            exit 0
          fi

          OLD_BID=$(python3 -c "import json;print(json.load(open('state/buildid.json')).get('buildid',''))")
          OLD_DEPOTS=$(python3 -c "import json;print(json.dumps(json.load(open('state/buildid.json')).get('depots',{}),sort_keys=True))")

          echo "old buildid = ${OLD_BID:-<空>}"
          echo "new buildid = $NEW_BID"
          echo "old depots  = $OLD_DEPOTS"
          echo "new depots  = $NEW_DEPOTS"

          if [ -z "$OLD_BID" ]; then
            echo "first_run=true" >> "$GITHUB_OUTPUT"
            echo "changed=false"  >> "$GITHUB_OUTPUT"
            echo "状态文件 buildid 为空，仅记录当前 buildid，不触发重建"
            exit 0
          fi

          if [ "$OLD_BID" != "$NEW_BID" ]; then
            echo "changed=true"   >> "$GITHUB_OUTPUT"
            echo "reason=buildid" >> "$GITHUB_OUTPUT"
            echo "检测到 buildid 变化: $OLD_BID -> $NEW_BID"
          elif [ -n "$NEW_DEPOTS" ] && [ "$NEW_DEPOTS" != "{}" ] && [ "$OLD_DEPOTS" != "$NEW_DEPOTS" ]; then
            # 兜底：buildid 未变但 depot manifest 变了（热更/回滚），同样需要重建
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "reason=depots" >> "$GITHUB_OUTPUT"
            echo "buildid 未变，但 depot manifest 变化，仍需重建"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无变化，跳过"
          fi

      - name: Commit state
        if: |
          (steps.compare.outputs.first_run == 'true' || steps.compare.outputs.changed == 'true')
        run: |
          set -euo pipefail
          mkdir -p state
          cp current.json state/buildid.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/buildid.json
          if git diff --cached --quiet; then
            echo "state 无实际改动，跳过提交"
            exit 0
          fi
          BID=$(python3 -c "import json;print(json.load(open('current.json'))['buildid'])")
          git commit -m "chore: CS2 buildid updated to ${BID}"
          # 重试推送，避免与并发 run 抢 head
          for i in 1 2 3; do
            if git push; then echo "push ok"; exit 0; fi
            echo "push 失败，第 $i 次重试 ..."
            git pull --rebase --autostash || true
            sleep 3
          done
          echo "::error::连续 3 次 push 失败"
          exit 1

      - name: Trigger rebuild
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          BID=$(python3 -c "import json;print(json.load(open('current.json'))['buildid'])")
          echo "检测到 CS2 更新 (buildid=$BID, 原因=${{ steps.compare.outputs.reason }})，触发重建 ..."

          # 已有 rebuild 在跑就不叠加，避免撞车
          RUNNING=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow rebuild-slim.yml \
                    --status in_progress --json databaseId --jq 'length' 2>/dev/null || echo 0)
          if [ "${RUNNING:-0}" -gt 0 ]; then
            echo "已有 rebuild-slim 在运行中（$RUNNING 个），本次跳过触发"
            exit 0
          fi

          gh workflow run rebuild-slim.yml --repo "$GITHUB_REPOSITORY" -f buildid="$BID"
          echo "已触发。可在 Actions 页查看 Rebuild Slim Packages 运行状态。"

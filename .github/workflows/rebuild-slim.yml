name: Rebuild Slim Packages

# 检测到 CS2 更新后自动重建（也可手动触发）：
#   1. create-release: 计算下一个版本号并创建 Release
#   2. build-linux / build-windows: 并行从 depot 重建 Linux/Windows 核心包并上传
#   3. finalize: 将新 Release 标记为 Latest
#
# 本工作流只操作当前仓库（cs2-slim-replica），使用 GITHUB_TOKEN 即可，
# 无需额外配置 secret。

on:
  workflow_dispatch:
    inputs:
      buildid:
        description: '触发重建的 CS2 buildid（可留空，自动读状态文件）'
        required: false
        default: ''
  repository_dispatch:
    types: [rebuild]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: cs2-slim-rebuild
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve buildid
        id: buildid
        run: |
          BID="${{ github.event.inputs.buildid || github.event.client_payload.buildid || '' }}"
          if [ -z "$BID" ] && [ -f state/buildid.json ]; then
            BID=$(python3 -c "import json;print(json.load(open('state/buildid.json'))['buildid'])")
          fi
          if [ -z "$BID" ]; then BID="manual"; fi
          echo "buildid=$BID" >> "$GITHUB_OUTPUT"
          echo "本次重建 buildid=$BID"

      - name: Compute next version and create release
        id: version
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          BID="${{ steps.buildid.outputs.buildid }}"

          # 幂等：同一个 buildid 已有 Release 就复用，避免重复重建把版本号
          # 一路刷成 v1.5.0/v1.6.0/v1.7.0 而内容完全相同。
          EXISTING=""
          if [ -n "$BID" ] && [ "$BID" != "manual" ]; then
            EXISTING=$(gh release list --repo "$REPO" --limit 100 --json tagName,name \
                       --jq ".[] | select(.name | test(\"buildid ${BID}\\b\")) | .tagName" \
                       2>/dev/null | head -n1 || true)
          fi
          if [ -n "$EXISTING" ]; then
            echo "buildid $BID 已有 Release $EXISTING，直接复用（幂等，不重复重建）"
            echo "tag=$EXISTING"  >> "$GITHUB_OUTPUT"
            echo "reuse=true"     >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 版本号取语义版本最大值。旧实现用默认排序（按创建时间）取 .[0]，
          # 一旦补发过旧版本 Release 就会算错。
          LAST=$(gh release list --repo "$REPO" --limit 100 --json tagName \
                 --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))]
                       | sort_by(ltrimstr("v") | split(".") | map(tonumber))
                       | if length == 0 then "" else .[-1] end' 2>/dev/null || echo "")
          [ -z "$LAST" ] && LAST="v1.2.0"

          BASE=$(echo "$LAST" | sed -n 's/^v\([0-9]*\)\.\([0-9]*\)\.[0-9]*$/\1.\2/p')
          if [ -z "$BASE" ]; then BASE="1.2"; fi
          MAJOR=${BASE%%.*}
          MINOR=${BASE#*.}
          # MINOR 用 10# 强转十进制，避免 08/09 被当八进制导致 $((MINOR+1)) 报错
          NEXT="v${MAJOR}.$((10#$MINOR + 1)).0"

          if gh release view "$NEXT" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $NEXT 已存在，直接复用"
          else
            gh release create "$NEXT" --repo "$REPO" \
              --title "CS2 Slim 精简服务端 ${MAJOR}.$((10#$MINOR + 1)).0 (CS2 更新重建 buildid ${BID})" \
              --notes "检测到 CS2 更新 (buildid ${BID})，自动重建。

          - Linux 核心包: cs2-slim.tar.gz
          - Windows 核心包: cs2-slim-win.zip" \
              --latest=false
          fi
          echo "tag=$NEXT"     >> "$GITHUB_OUTPUT"
          echo "reuse=false"   >> "$GITHUB_OUTPUT"

  build-linux:
    needs: create-release
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show disk
        run: df -h / || true

      - name: Prepare tools
        run: python scripts/updater/prepare_tools.py --workdir ./cs2-build --platform linux

      - name: Generate config
        run: |
          cat > slim-linux.yaml <<'EOF'
          platform: linux
          maps: []
          features: []
          workdir: ./cs2-build
          EOF

      - name: Download depots
        run: python cs2slim.py download --config slim-linux.yaml --depot-tool "$PWD/cs2-build/tools/DepotDownloader"

      - name: Extract loose files
        run: python cs2slim.py extract --config slim-linux.yaml

      - name: Clean up numbered packs
        run: python scripts/updater/cleanup_depot.py --workdir ./cs2-build

      - name: Build slim tree
        run: python cs2slim.py build --config slim-linux.yaml

      - name: Package
        run: python cs2slim.py package --config slim-linux.yaml --format tar.gz

      - name: Upload release asset
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          cp cs2-build/cs2-slim-linux.tar.gz cs2-build/cs2-slim.tar.gz
          gh release upload "$TAG" cs2-build/cs2-slim.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          echo "已上传 cs2-slim.tar.gz 到 $TAG"

      - name: Show final disk
        run: df -h / || true

  build-windows:
    needs: create-release
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show disk
        run: df -h / || true

      - name: Prepare tools
        run: python scripts/updater/prepare_tools.py --workdir ./cs2-build --platform win64

      - name: Generate config
        run: |
          cat > slim-win.yaml <<'EOF'
          platform: win64
          maps: []
          features: []
          workdir: ./cs2-build
          EOF

      - name: Download depots
        run: python cs2slim.py download --config slim-win.yaml --depot-tool "$PWD/cs2-build/tools/DepotDownloader"

      - name: Extract loose files
        run: python cs2slim.py extract --config slim-win.yaml

      - name: Clean up numbered packs
        run: python scripts/updater/cleanup_depot.py --workdir ./cs2-build

      - name: Build slim tree
        run: python cs2slim.py build --config slim-win.yaml

      - name: Package
        run: python cs2slim.py package --config slim-win.yaml --format zip

      - name: Upload release asset
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          cp cs2-build/cs2-slim-win64.zip cs2-build/cs2-slim-win.zip
          gh release upload "$TAG" cs2-build/cs2-slim-win.zip --repo "$GITHUB_REPOSITORY" --clobber
          echo "已上传 cs2-slim-win.zip 到 $TAG"

      - name: Show final disk
        run: df -h / || true

  finalize:
    needs: [create-release, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Verify assets present
        run: |
          set -euo pipefail
          TAG="${{ needs.create-release.outputs.tag }}"
          echo "Release $TAG assets:"
          NAMES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          printf '%s\n' "$NAMES"

          # 两个包都必须在，否则不要标 Latest
          # （防止半成品 Release 被本地 updater 当成最新版拉走）
          MISSING=0
          for a in cs2-slim.tar.gz cs2-slim-win.zip; do
            if ! printf '%s\n' "$NAMES" | grep -qx "$a"; then
              echo "::error::缺少 asset: $a"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "资产不全，跳过标记 Latest"
            exit 1
          fi
          echo "资产齐全"

      - name: Mark release as latest
        run: |
          set -euo pipefail
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
          echo "Release $TAG 已标记为 Latest"
